<div class="trust-score-card">
    <!-- Header -->
    <div class="trust-score-header">
        <span class="trust-score-title">Твоят Trust Score</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-info-circle" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
        </svg>
    </div>

    <!-- Body: Circle + Improvement -->
    <div class="trust-score-body">
        <!-- Circle -->
        <div class="trust-score-circle">
            <svg viewBox="0 0 150 150" class="trust-score-svg">
                <!-- Background circle -->
                <circle cx="75" cy="75" r="65" fill="none" stroke="#e6f2eb" stroke-width="10"/>
                <!-- Progress circle (92%) -->
                <circle cx="75" cy="75" r="65" fill="none" stroke="#154d29" stroke-width="10"
                        stroke-dasharray="408.4" stroke-dashoffset="32.67"
                        stroke-linecap="round"
                        transform="rotate(-90 75 75)"/>
            </svg>
            <div class="trust-score-circle-inner">
                <div class="trust-score-score">
                    <span class="trust-score-number">92</span>
                    <span class="trust-score-total">/100</span>
                </div>
                <div class="trust-score-label">Отличен</div>
            </div>
        </div>

        <!-- Improvement badge -->
        <div class="trust-score-improvement">
            <div class="trust-score-badge">+3</div>
            <div class="trust-score-improvement-text">
                спрямо<br>миналия месец
            </div>
        </div>
    </div>

    <!-- Bottom message -->
    <div class="trust-score-message">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-graph-up-arrow" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5"/>
        </svg>
        <div>
            <strong>Продължавай в същата посока!</strong><br>
            <span>Твоят рейтинг се подобрява.</span>
        </div>
    </div>
</div>
