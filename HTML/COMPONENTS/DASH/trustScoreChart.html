<div class="trust-score-chart-card">
    <!-- Header -->

        <div class="trust-score-chart-period dropdown">

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item period-option" href="#" data-period="1">Последен 1 месец</a></li>
                <li><a class="dropdown-item period-option" href="#" data-period="3">Последни 3 месеца</a></li>
                <li><a class="dropdown-item period-option active" href="#" data-period="6">Последни 6 месеца</a></li>
                <li><a class="dropdown-item period-option" href="#" data-period="12">Последни 12 месеца</a></li>
            </ul>

    </div>

    <!-- Chart -->
    <div class="trust-score-chart-wrapper">
        <canvas id="TrustScoreChart"></canvas>
    </div>
