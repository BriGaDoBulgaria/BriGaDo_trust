<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriGaDo TRUST - Вход</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Твоите стилове -->
    <link rel="stylesheet" href="/CSS/PAGES/styles.css">
    <link rel="stylesheet" href="/CSS/COMPONENTS/NAVBARS/navbar.css">
    <link rel="stylesheet" href="/CSS/PAGES/REGISTRATION/login.css  ">
</head>
<body>
    <!-- Навбар (ако искаш да го има и тук) -->
    <div id="navbar-placeholder"></div>

    <!-- Основно съдържание -->
    <main class="login-page">
        <div class="login-container">

            <!-- Header -->
            <div class="login-header">
                <h1>Добре дошли отново</h1>
                <p>Влезте в своя профил, за да продължите.</p>
            </div>

            <!-- Форма -->
            <form id="loginForm" class="login-form">

                <!-- Имейл / Потребителско име -->
                <div class="form-group">
                    <label for="loginIdentifier">Имейл или потребителско име</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                        </svg>
                        <input type="text" id="loginIdentifier" name="loginIdentifier" placeholder="example@domain.bg" required>
                    </div>
                </div>

                <!-- Парола -->
                <div class="form-group">
                    <label for="loginPassword">Парола</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                        </svg>
                        <input type="password" id="loginPassword" name="loginPassword" placeholder="Въведете вашата парола" required>

                        <!-- Бутон за показване на паролата -->
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Покажи паролата">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Запомни ме и забравена парола -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="rememberMe">
                        <span>Запомни ме</span>
                    </label>
                    <a href="#" class="forgot-password">Забравена парола?</a>
                </div>

                <!-- Бутон за вход -->
                <button type="submit" class="btn-login">Вход</button>
            </form>

            <!-- Линк към регистрация -->
            <div class="login-footer">
                <p>Нямате профил? <a href="/HTML/PAGES/REGISTRATION/registerSelection.html">Регистрирайте се тук</a></p>
            </div>

        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Скрипт за показване на паролата -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('loginPassword');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function () {
                    // Превключване на типа
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    // Превключване на иконата (око / зачертано око)
                    this.classList.toggle('show-password');
                });
            }
        });
    </script>
</body>
</html>
