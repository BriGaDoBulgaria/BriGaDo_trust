<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriGaDo TRUST - Регистрация на посредник</title>
    <script src="../../../JS/UTIL/components.js"></script>
    <script src="../../../JS/FRONTEND/PAGES/registerFormEngine.js"></script>
    <link rel="stylesheet" href="../../../CSS/PAGES/REGISTRATION/multiStepForm.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="../../../CSS/COMPONENTS/navbar.css">

</head>
<body>
    <div id="navbar-placeholder"></div>

    <div id="agent-registration-form" class="multi-step-form" data-form-type="agent">    
    <!-- Секция 1: Основна информация -->
    <div id="section-1" class="form-section active">
        <h3>Основна информация</h3>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="agency-name">Име на агенцията <span class="required">*</span></label>
                <input type="text" id="agency-name" name="agency-name" placeholder="Въведете име на агенцията" required>
            </div>
            
            <div class="form-group">
                <label for="agency-eik">ЕИК / Булстат <span class="required">*</span></label>
                <input type="text" id="agency-eik" name="agency-eik" placeholder="Въведете ЕИК / Булстат" required pattern="^\d{9}$">
            </div>
            
            <div class="form-group">
                <label for="agency-type">Тип агенция <span class="required">*</span></label>
                <select id="agency-type" name="agency-type" required>
                    <option value="">Изберете тип агенция</option>
                    <option value="hr">Подбор на персонал (HR)</option>
                    <option value="accounting">Счетоводни услуги</option>
                    <option value="security">Охранителна дейност</option>
                    <option value="other">Друга</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="agency-website">Уебсайт</label>
                <input type="url" id="agency-website" name="agency-website" placeholder="https://">
            </div>
            
            <div class="form-group">
                <label for="agency-phone">Телефон <span class="required">*</span></label>
                <input type="tel" id="agency-phone" name="agency-phone" placeholder="+359 XXX XXX XXX" required pattern="^(\+359|0)?\s?[0-9]{9}$">
            </div>
            
            <div class="form-group">
                <label for="agency-email">Имейл <span class="required">*</span></label>
                <input type="email" id="agency-email" name="agency-email" placeholder="example@domain.bg" required>
            </div>
            
            <div class="form-group full-width">
                <label for="agency-address">Адрес на управление <span class="required">*</span></label>
                <input type="text" id="agency-address" name="agency-address" placeholder="Въведете адрес" required>
            </div>
            
            <div class="form-group full-width">
                <label for="agency-city">Град <span class="required">*</span></label>
                <input type="text" id="agency-city" name="agency-city" placeholder="Въведете град" required>
            </div>

            <div class="form-group full-width">
    <label for="agency-password">Парола <span class="required">*</span></label>
    <input type="password" id="agency-password" name="agency-password" 
           placeholder="Мин. 8 символа, 2 цифри, 1 специален символ" 
           regex="^(?=.*[0-9].*[0-9])(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\\/-]).{8,}$"
           required 
           </div>
        </div>
        </div>
    </div>
    <!-- Секция 2: Лице за контакт -->
    <div id="section-2" class="form-section">
        <h3>Лице за контакт</h3>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="contact-firstname">Име <span class="required">*</span></label>
                <input type="text" id="contact-firstname" name="contact-firstname" placeholder="Въведете име" required>
            </div>
            
            <div class="form-group">
                <label for="contact-lastname">Фамилия <span class="required">*</span></label>
                <input type="text" id="contact-lastname" name="contact-lastname" placeholder="Въведете фамилия" required>
            </div>
            
            <div class="form-group">
                <label for="contact-position">Длъжност <span class="required">*</span></label>
                <input type="text" id="contact-position" name="contact-position" placeholder="Въведете длъжност" required>
            </div>
            
            <div class="form-group">
                <label for="contact-phone">Телефон <span class="required">*</span></label>
                <input type="tel" id="contact-phone" name="contact-phone" placeholder="+359 XXX XXX XXX" required pattern="^(\+359|0)?\s?[0-9]{9}$">
            </div>
            
            <div class="form-group">
                <label for="contact-email">Имейл <span class="required">*</span></label>
                <input type="email" id="contact-email" name="contact-email" placeholder="example@domain.bg" required>
            </div>
        </div>
    </div>

    <!-- Секция 3: Допълнителна информация -->
    <div id="section-3" class="form-section">
        <h3>Допълнителна информация</h3>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="license-number">Номер на лиценз / Регистрация <span class="required">*</span></label>
                <input type="text" id="license-number" name="license-number" placeholder="Въведете номер на лиценз" required>
            </div>
            
            <div class="form-group">
                <label for="license-date">Дата на издаване <span class="required">*</span></label>
                <input type="date" id="license-date" name="license-date" required>
            </div>
            
            <div class="form-group">
                <label for="license-issuer">Издаващ орган <span class="required">*</span></label>
                <input type="text" id="license-issuer" name="license-issuer" placeholder="Въведете издаващ орган" required>
            </div>
        </div>
    </div>

    <!-- Секция 4: Документи -->
    <div id="section-4" class="form-section">
        <h3>Документи</h3>
        
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="document-status">Удостоверение за актуално състояние <span class="required">*</span></label>
                <div class="file-upload-wrapper">
                    <input type="file" id="document-status" name="document-status" accept=".pdf,.doc,.docx" required>
                    <div class="file-upload-message">
                        <p>Качете файл</p>
                        <small>(PDF, DOC, DOCX, до 10 MB)</small>
                    </div>
                </div>
            </div>
            
            <div class="form-group full-width">
                <label for="document-license">Копие от лиценз / Регистрация <span class="required">*</span></label>
                <div class="file-upload-wrapper">
                    <input type="file" id="document-license" name="document-license" accept=".pdf,.doc,.docx" required>
                    <div class="file-upload-message">
                        <p>Качете файл</p>
                        <small>(PDF, DOC, DOCX, до 10 MB)</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Навигационни бутони -->
    <div class="form-navigation">
        <button type="button" id="btn-prev" class="btn btn-outline-primary btn-prev"  disabled>← Назад</button>
        <button type="button" id="btn-next" class="btn btn-primary btn-next">Продължи →</button>
    </div>
</div>
</body>
</html>
