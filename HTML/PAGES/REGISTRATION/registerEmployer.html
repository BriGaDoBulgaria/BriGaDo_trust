<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriGaDo TRUST - Регистрация на работодател</title>
    <script src="../../../JS/UTIL/components.js"></script>
    <script src="../../../JS/FRONTEND/PAGES/registerFormEngine.js"></script>
    <link rel="stylesheet" href="../../../CSS/PAGES/REGISTRATION/multiStepForm.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="../../../CSS/COMPONENTS/navbar.css">

</head>
<body>
    <div id="navbar-placeholder"></div>

    <div id="employer-registration-form" class="multi-step-form" data-form-type="employer">    
        <!-- Секция 1: Данни за фирмата -->
        <div id="section-1" class="form-section active">
            <h3>Данни за фирмата</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="company-name">Име на фирмата <span class="required">*</span></label>
                    <input type="text" id="company-name" name="company-name" placeholder="Въведете име на фирмата" required>
                </div>
                
                <div class="form-group">
                    <label for="company-eik">ЕИК / Булстат <span class="required">*</span></label>
                    <input type="text" id="company-eik" name="company-eik" placeholder="Въведете ЕИК / Булстат" required pattern="^\d{9}$">
                </div>
                
                <div class="form-group">
                    <label for="company-sector">Индустрия / Сектор <span class="required">*</span></label>
                    <select id="company-sector" name="company-sector" required>
                        <option value="">Изберете сектор</option>
                        <option value="it">ИТ и технологии</option>
                        <option value="manufacturing">Производство</option>
                        <option value="finance">Финанси и застраховане</option>
                        <option value="retail">Търговия на дребно</option>
                        <option value="healthcare">Здравеопазване</option>
                        <option value="other">Друга</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="company-city">Град / Седалище <span class="required">*</span></label>
                    <input type="text" id="company-city" name="company-city" placeholder="Въведете град" required>
                </div>
                
                <div class="form-group">
                    <label for="company-address">Адрес <span class="required">*</span></label>
                    <input type="text" id="company-address" name="company-address" placeholder="Въведете адрес" required>
                </div>
                
                <div class="form-group">
                    <label for="company-website">Уебсайт (по избор)</label>
                    <input type="url" id="company-website" name="company-website" placeholder="https://">
                </div>
                
                <div class="form-group full-width">
                    <label for="company-password">Парола <span class="required">*</span></label>
                    <input type="password" id="company-password" name="company-password" 
                           placeholder="Мин. 8 символа, 2 цифри, 1 специален символ" 
                           required 
                           pattern="^(?=.*[0-9].*[0-9])(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\/-]).{8,}$"
                           title="Паролата трябва да съдържа минимум 8 символа, поне 2 цифри и 1 специален символ">
                </div>
            </div>
        </div>

        <!-- Секция 2: Лице за контакт -->
        <div id="section-2" class="form-section">
            <h3>Лице за контакт</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="contact-firstname">Име <span class="required">*</span></label>
                    <input type="text" id="contact-firstname" name="contact-firstname" placeholder="Въведете име" required>
                </div>
                
                <div class="form-group">
                    <label for="contact-lastname">Фамилия <span class="required">*</span></label>
                    <input type="text" id="contact-lastname" name="contact-lastname" placeholder="Въведете фамилия" required>
                </div>
                
                <div class="form-group">
                    <label for="contact-position">Длъжност <span class="required">*</span></label>
                    <input type="text" id="contact-position" name="contact-position" placeholder="Въведете длъжност" required>
                </div>
                
                <div class="form-group">
                    <label for="contact-phone">Телефон <span class="required">*</span></label>
                    <input type="tel" id="contact-phone" name="contact-phone" placeholder="+359 XXX XXX XXX" required pattern="^(\+359|0)?\s?[0-9]{9}$">
                </div>
                
                <div class="form-group">
                    <label for="contact-email">Имейл <span class="required">*</span></label>
                    <input type="email" id="contact-email" name="contact-email" placeholder="example@domain.bg" required>
                </div>
            </div>
        </div>

        <!-- Секция 3: Допълнителна информация -->
        <div id="section-3" class="form-section">
            <h3>Допълнителна информация (по избор)</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="company-employees">Брой служители</label>
                    <select id="company-employees" name="company-employees">
                        <option value="">Изберете брой</option>
                        <option value="1-10">1 - 10</option>
                        <option value="11-50">11 - 50</option>
                        <option value="51-200">51 - 200</option>
                        <option value="200+">200+</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="company-year">Година на създаване</label>
                    <input type="number" id="company-year" name="company-year" placeholder="ГГГГ" min="1900" max="2026">
                </div>
                
                <div class="form-group full-width">
                    <label for="company-description">Кратко описание на дейността</label>
                    <textarea id="company-description" name="company-description" rows="4" maxlength="500" placeholder="Напишете накратко с какво се занимава фирмата"></textarea>
                </div>
            </div>
        </div>

        <!-- Секция 4: Документи -->
        <div id="section-4" class="form-section">
            <h3>Документи</h3>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="document-status">Удостоверение за актуално състояние <span class="required">*</span></label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="document-status" name="document-status" accept=".pdf,.doc,.docx" required>
                        <div class="file-upload-message">
                            <p>Качете файл</p>
                            <small>(PDF, DOC, DOCX, до 10 MB)</small>
                        </div>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="company-logo">Лого на фирмата (по избор)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="company-logo" name="company-logo" accept=".jpg,.png,.gif,.webp">
                        <div class="file-upload-message">
                            <p>Качете файл</p>
                            <small>(JPG, PNG, до 5 MB)</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Навигационни бутони -->
        <div class="form-navigation">
            <button type="button" id="btn-prev" class="btn btn-outline-primary btn-prev" disabled>← Назад</button>
            <button type="button" id="btn-next" class="btn btn-primary btn-next">Продължи →</button>
        </div>
    </div>
</body>
</html>
