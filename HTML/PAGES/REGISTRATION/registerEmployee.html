<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriGaDo TRUST - Регистрация на служител</title>
    <script src="../../../JS/UTIL/components.js"></script>
    <script src="../../../JS/FRONTEND/PAGES/registerFormEngine.js"></script>
    <link rel="stylesheet" href="../../../CSS/PAGES/REGISTRATION/multiStepForm.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="../../../CSS/COMPONENTS/navbar.css">

</head>
<body>
    <div id="navbar-placeholder"></div>

    <div id="employee-registration-form" class="multi-step-form" data-form-type="employee">
    
        <!-- Секция 1: Лични данни -->
        <div id="section-1" class="form-section active">
            <h3>Лични данни</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="employee-firstname">Име <span class="required">*</span></label>
                    <input type="text" id="employee-firstname" name="employee-firstname" placeholder="Въведете име" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-middlename">Презиме</label>
                    <input type="text" id="employee-middlename" name="employee-middlename" placeholder="Въведете презиме">
                </div>
                
                <div class="form-group">
                    <label for="employee-lastname">Фамилия <span class="required">*</span></label>
                    <input type="text" id="employee-lastname" name="employee-lastname" placeholder="Въведете фамилия" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-birthdate">Дата на раждане <span class="required">*</span></label>
                    <input type="date" id="employee-birthdate" name="employee-birthdate" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-phone">Телефон <span class="required">*</span></label>
                    <input type="tel" id="employee-phone" name="employee-phone" placeholder="+359 XXX XXX XXX" required pattern="^(\+359|0)?\s?[0-9]{9}$">
                </div>
                
                <div class="form-group">
                    <label for="employee-email">Имейл <span class="required">*</span></label>
                    <input type="email" id="employee-email" name="employee-email" placeholder="example@domain.bg" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-egn">ЕГН <span class="required">*</span></label>
                    <input type="text" id="employee-egn" name="employee-egn" placeholder="Въведете ЕГН" required pattern="^\d{10}$">
                </div>
                
                <div class="form-group">
                    <label for="employee-city">Град / Населено място <span class="required">*</span></label>
                    <input type="text" id="employee-city" name="employee-city" placeholder="Въведете град" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="employee-password">Парола <span class="required">*</span></label>
                    <input type="password" id="employee-password" name="employee-password" 
                           placeholder="Мин. 8 символа, 2 цифри, 1 специален символ" 
                           required 
                           pattern="^(?=.*[0-9].*[0-9])(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\/-]).{8,}$"
                           title="Паролата трябва да съдържа минимум 8 символа, поне 2 цифри и 1 специален символ">
                </div>
            </div>
        </div>

        <!-- Секция 2: Текущо работно място -->
        <div id="section-2" class="form-section">
            <h3>Текущо работно място</h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="employee-company">Име на фирмата <span class="required">*</span></label>
                    <input type="text" id="employee-company" name="employee-company" placeholder="Въведете име на фирмата" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-contract">Номер на договор <span class="required">*</span></label>
                    <input type="text" id="employee-contract" name="employee-contract" placeholder="Въведете номер на договор" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-position">Длъжност <span class="required">*</span></label>
                    <input type="text" id="employee-position" name="employee-position" placeholder="Въведете длъжност" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-start-date">Дата на встъпване в длъжност <span class="required">*</span></label>
                    <input type="date" id="employee-start-date" name="employee-start-date" required>
                </div>
                
                <div class="form-group">
                    <label for="employee-work-city">Град на работа <span class="required">*</span></label>
                    <input type="text" id="employee-work-city" name="employee-work-city" placeholder="Въведете град" required>
                </div>
            </div>
        </div>

        <!-- Секция 3: Документи -->
        <div id="section-3" class="form-section">
            <h3>Документи</h3>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="employee-cv">CV <span class="required">*</span></label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="employee-cv" name="employee-cv" accept=".pdf,.doc,.docx" required>
                        <div class="file-upload-message">
                            <p>Качете своето актуално CV</p>
                            <small>(PDF, DOC, DOCX, до 10 MB)</small>
                        </div>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="employee-extra">Допълнителна информация (по избор)</label>
                    <textarea id="employee-extra" name="employee-extra" rows="3" placeholder="Може да добавите допълнителна информация, която смятате, че е важна за твоя профил."></textarea>
                </div>
            </div>
        </div>

        <!-- Навигационни бутони -->
        <div class="form-navigation">
            <button type="button" id="btn-prev" class="btn btn-outline-primary btn-prev" disabled>← Назад</button>
            <button type="button" id="btn-next" class="btn btn-primary btn-next">Продължи →</button>
        </div>
    </div>
</body>
</html>
